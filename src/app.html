<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Application branding surface: name, logo, metadata, and splash UI. -->
		<link rel="icon" type="image/png" href="/static/favicon.png" crossorigin="use-credentials" />
		<link
			rel="icon"
			type="image/png"
			href="/static/favicon-96x96.png"
			sizes="96x96"
			crossorigin="use-credentials"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/static/favicon.svg"
			crossorigin="use-credentials"
		/>
		<link rel="shortcut icon" href="/static/favicon.ico" crossorigin="use-credentials" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#0b4f6c" />
		<meta name="robots" content="noindex,nofollow" />

		<script src="/static/loader.js" defer crossorigin="use-credentials"></script>
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				// Brand palette: keep in sync with BRAND_COLORS in src/lib/constants.ts
				// and the --brand-* variables at the end of this file.
				const BRAND_PRIMARY = '#0b4f6c';
				const BRAND_SURFACE_LIGHT = '#e8f1f5';
				const BRAND_SURFACE_DARK = '#042a3a';

				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute(
						'content',
						prefersDarkTheme ? BRAND_PRIMARY : BRAND_SURFACE_LIGHT
					);
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', BRAND_SURFACE_DARK);
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', BRAND_SURFACE_LIGHT);
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', BRAND_PRIMARY);
				}

				// Splash logo assets (see static/splash*.png).
				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/splash-dark.png'
					: '/static/splash.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', BRAND_PRIMARY);
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', BRAND_SURFACE_LIGHT);
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				// Splash logo (see static/splash*.png).
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

		<title>Chatbot Navegación Miño-Sil</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					max-width: 90vw;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<!-- Splash logo (see static/splash.png). -->
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					loading="eager"
					fetchpriority="high"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: min(16rem, 70vw); margin-top: 1.25rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.35rem;

							border-radius: 9999px;
							background-color: rgba(11, 79, 108, 0.15);
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 40%;
							height: 0.35rem;
							border-radius: 9999px;
							background: linear-gradient(90deg, #0b4f6c, #2bb3a3);
						"
						class="splash-progress-indeterminate"
					></div>
				</div>
			</div>

			<svg
				id="splash-wave"
				aria-hidden="true"
				viewBox="0 0 1440 120"
				preserveAspectRatio="none"
				style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 7rem; opacity: 0.55"
			>
				<path
					fill="#2bb3a3"
					d="M0,64 C240,120 480,0 720,48 C960,96 1200,16 1440,56 L1440,120 L0,120 Z"
				>
					<animate
						attributeName="d"
						dur="8s"
						repeatCount="indefinite"
						values="
							M0,64 C240,120 480,0 720,48 C960,96 1200,16 1440,56 L1440,120 L0,120 Z;
							M0,48 C240,0 480,96 720,64 C960,32 1200,100 1440,40 L1440,120 L0,120 Z;
							M0,64 C240,120 480,0 720,48 C960,96 1200,16 1440,56 L1440,120 L0,120 Z
						"
					/>
				</path>
				<path
					fill="#0b4f6c"
					opacity="0.55"
					d="M0,80 C320,20 560,110 800,70 C1040,30 1280,90 1440,60 L1440,120 L0,120 Z"
				>
					<animate
						attributeName="d"
						dur="11s"
						repeatCount="indefinite"
						values="
							M0,80 C320,20 560,110 800,70 C1040,30 1280,90 1440,60 L1440,120 L0,120 Z;
							M0,70 C320,100 560,30 800,80 C1040,110 1280,40 1440,75 L1440,120 L0,120 Z;
							M0,80 C320,20 560,110 800,70 C1040,30 1280,90 1440,60 L1440,120 L0,120 Z
						"
					/>
				</path>
			</svg>
		</div>
	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}

		/* Brand palette: keep in sync with BRAND_COLORS in src/lib/constants.ts.
		   Also used by static/custom.css. */
		:root {
			--brand-primary: #0b4f6c;
			--brand-accent: #2bb3a3;
			--brand-surface-light: #e8f1f5;
			--brand-surface-dark: #042a3a;
			--brand-body-surface: #f4efe6;
		}

		#splash-screen {
			background: linear-gradient(180deg, #e8f1f5 0%, #f4efe6 55%, #e8f1f5 100%);
		}

		html.dark #splash-screen {
			background: linear-gradient(180deg, #021820 0%, #042a3a 55%, #021820 100%);
		}

		html.her #splash-screen {
			background: #983724;
		}

		#logo-her {
			display: none;
		}

		#progress-background {
			display: block;
		}

		#progress-bar {
			display: block;
		}

		html.her #logo {
			display: none;
		}

		html.her #logo-her {
			display: block;
			filter: invert(1);
		}

		html.her #splash-wave {
			display: none;
		}

		html.her #progress-background {
			display: block;
			background-color: #fafafa9a !important;
		}

		html.her #progress-bar {
			display: block;
			background: #fff !important;
			width: 0% !important;
			animation: none !important;
		}

		@media (max-width: 24rem) {
			html.her #progress-background {
				display: none;
			}

			html.her #progress-bar {
				display: none;
			}
		}

		@keyframes pulse {
			50% {
				opacity: 0.65;
			}
		}

		.animate-pulse-fast {
			animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}

		@keyframes splash-progress {
			0% {
				transform: translateX(-120%);
			}
			100% {
				transform: translateX(280%);
			}
		}

		.splash-progress-indeterminate {
			animation: splash-progress 1.4s ease-in-out infinite;
		}

		@media (prefers-reduced-motion: reduce) {
			.animate-pulse-fast,
			.splash-progress-indeterminate {
				animation: none !important;
			}

			#splash-wave animate {
				display: none;
			}
		}
	</style>
</html>
